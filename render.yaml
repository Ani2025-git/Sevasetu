services:
  - type: web
    name: sevasetu-backend
    runtime: python
    plan: free
    region: oregon
    branch: main
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: "*"
      - key: FLASK_DEBUG
        value: "false"
      - key: STALE_THRESHOLD_MINUTES
        value: "30"
      - key: DATABASE_URL
        sync: false

